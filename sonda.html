<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="/index.html" style="width:1440px;height:900px;border:0"></iframe><pre id="r"></pre>
<script>
const espera=ms=>new Promise(s=>setTimeout(s,ms));
document.getElementById('f').onload=async()=>{
  const d=document.getElementById('f').contentDocument, w=document.getElementById('f').contentWindow;
  try{ w.localStorage.removeItem('gigi.abiertas'); }catch(e){}
  const o=[];
  w.addEventListener('error', e=>o.push('ERROR JS: '+e.message));
  d.querySelectorAll('.caja')[2].click();
  await espera(1200);
  const rev=d.querySelector('.revelado'), fig=d.querySelector('img.figura');
  const cr=getComputedStyle(rev), cf=getComputedStyle(fig);
  o.push(`revelado: hidden=${rev.hidden} visible=${rev.dataset.visible} display=${cr.display} opacity=${cr.opacity} z=${cr.zIndex} bg=${cr.backgroundColor}`);
  o.push(`nombre: "${d.querySelector('.revelado__nombre').textContent}"`);
  o.push(`figura: hidden=${fig.hidden} z=${cf.zIndex} h=${cf.height} transform=${cf.transform}`);
  const r=fig.getBoundingClientRect();
  o.push(`figura rect: x=${Math.round(r.left)}..${Math.round(r.right)} (centro ${Math.round(r.left+r.width/2)}, pantalla ${w.innerWidth/2})`);
  document.getElementById('r').textContent=o.join('\n');
};
</script></body></html>
