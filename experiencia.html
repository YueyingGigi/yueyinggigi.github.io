<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <!-- textura de tinta: desplaza un poco los bordes, como un sello de verdad -->
    <filter id="f-tinta" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="11" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="1.0"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Las dos líneas acaban igual de anchas, pero cada una con su
         tamaño: YING tiene cuatro letras, así que va más pequeña y no
         se le aprietan. Sin esto, "ING" se junta y no se lee. -->
    <symbol id="s-sello" viewBox="0 0 100 100">
      <g filter="url(#f-tinta)">
        <rect x="3" y="3" width="94" height="94" rx="5" fill="#D9412B"/>
        <text x="50" y="45" font-family="Fraunces, Georgia, serif" font-weight="900"
              font-size="33" fill="#fff" text-anchor="middle"
              textLength="70" lengthAdjust="spacing">YUE</text>
        <text x="50" y="84" font-family="Fraunces, Georgia, serif" font-weight="900"
              font-size="27" fill="#fff" text-anchor="middle"
              textLength="70" lengthAdjust="spacing">YING</text>
      </g>
    </symbol>

    <!-- Sobre mí · un marco de fotos -->
    <symbol id="i-marco" viewBox="0 0 24 24">
      <rect x="3.5" y="2.5" width="17" height="19" rx="1.2"/>
      <rect x="6.6" y="5.6" width="10.8" height="12.8" rx=".6"/>
    </symbol>
    <!-- Experiencia · un sello chino -->
    <symbol id="i-sello" viewBox="0 0 24 24">
      <path d="M10.2 2.6h3.6v5.2h-3.6z"/>
      <rect x="6.4" y="7.8" width="11.2" height="3.4" rx=".9"/>
      <rect x="3.6" y="13.6" width="16.8" height="7.8" rx="1.2"/>
      <path d="M7.2 16.4h9.6M7.2 18.8h6.4"/>
    </symbol>
    <!-- Mis trabajos · un móvil grabando -->
    <symbol id="i-movil" viewBox="0 0 24 24">
      <rect x="6.8" y="1.8" width="10.4" height="20.4" rx="2.4"/>
      <path d="M10.4 4.6h3.2"/>
      <circle cx="12" cy="12.4" r="2.6"/>
    </symbol>
    <!-- Mi vida en España · el traje de fallera -->
    <symbol id="i-fallera" viewBox="0 0 24 24">
      <path d="M9.6 3.2h4.8l-.7 4.4H10.3z"/>
      <path d="M9.3 7.6h5.4c2.6 3.4 4.2 8.2 4.8 13.2H4.5c.6-5 2.2-9.8 4.8-13.2z"/>
      <path d="M8.2 16.4h7.6"/>
    </symbol>
    <!-- Colabora conmigo · una caja de regalo -->
    <symbol id="i-regalo" viewBox="0 0 24 24">
      <rect x="3.2" y="8.6" width="17.6" height="12.6" rx="1.2"/>
      <path d="M3.2 13h17.6M12 8.6v12.6"/>
      <path d="M12 8.6C11.1 5.6 8.9 4.4 7.6 5.6c-1.2 1.2.3 3 4.4 3zM12 8.6c.9-3 3.1-4.2 4.4-3 1.2 1.2-.3 3-4.4 3z"/>
    </symbol>
  </defs>
</svg>
